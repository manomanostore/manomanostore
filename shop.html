<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop — ManoMano</title>
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/logo-64.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo-192.png">
<link rel="stylesheet" href="css/styles.css?v=20261129b">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> › <span>Shops</span> › <span id="crumb">Shop</span></div>

  <!-- store header: picture, name, verified, rating, product count, joined -->
  <section class="shop-hero" id="shopHero" aria-live="polite">
    <span class="shop-av shop-av-lg skeleton"></span>
    <div class="shop-hero-txt">
      <div class="skeleton" style="height:24px;width:220px;max-width:70%"></div>
      <div class="skeleton" style="height:14px;width:160px;margin-top:10px"></div>
    </div>
  </section>

  <div class="block-head shop-head" id="shopHead" hidden>
    <h2>Products</h2>
    <label class="shop-find"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="shopFind" type="search" placeholder="Search in this shop" aria-label="Search in this shop" autocomplete="off"></label>
  </div>
  <div class="grid" id="shopGrid">__SK__</div>
  <div class="empty" id="shopEmpty" hidden><h3 id="shopEmptyT">No products yet</h3><p id="shopEmptyP">This shop hasn't added any products.</p></div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js?v=20261129b"></script>
<script src="js/visit.js?v=20261128zf"></script>
<script src="data/catalog.js"></script>
<script src="js/data.js?v=20261128w"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js?v=20261129c"></script>
<script src="js/render.js"></script>
<script src="js/shops.js?v=20261129a"></script>
<script src="js/shop.js?v=20261129b"></script>
<script>
  document.getElementById("shopGrid").innerHTML = RENDER.skeletons(8);
  UI.mount({}).then(SHOP.init);
  RENDER.wireAdd(document);
</script>
</body>
</html>
