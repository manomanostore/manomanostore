<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ManoMano — DIY, home & garden</title>
<meta name="description" content="ManoMano — DIY, home improvement, garden and tools at smart prices.">
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/logo-64.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="hero-row">
  <div class="hero-left">
  <section class="hero-carousel" id="heroCarousel" aria-label="Promotions" aria-roledescription="carousel">
    <div class="hc-viewport">
      <div class="hc-track" id="hcTrack">
        <a class="hc-slide" href="deals.html"><img src="images/banner-1.png" alt="Mega sale on popular products — up to 60% off" width="1600" height="533" fetchpriority="high"></a>
        <a class="hc-slide" href="deals.html"><img src="images/banner-2.png" alt="New season styles — buy 2, get 1 free" width="1600" height="533" loading="lazy"></a>
        <a class="hc-slide" href="deals.html"><img src="images/banner-3.png" alt="Beauty week — up to 45% off" width="1600" height="533" loading="lazy"></a>
        <a class="hc-slide" href="deals.html"><img src="images/banner-4.png" alt="The latest smartphones from $699" width="1600" height="533" loading="lazy"></a>
      </div>
    </div>
    <button class="hc-arrow hc-prev" type="button" aria-label="Previous banner"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="hc-arrow hc-next" type="button" aria-label="Next banner"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="hc-dots" id="hcDots" role="tablist" aria-label="Choose banner"></div>
  </section>
    <section class="cat-circles-wrap" aria-label="Shop by category">
      <div class="cat-circles" id="catCircles"></div>
    </section>
    </div>
    <aside class="today-deals" aria-label="Today's deals">
      <div class="td-head"><h2 data-i18n="home.today">Today's Deals</h2><span class="td-hot" data-i18n="home.hot">Hot</span></div>
      <div class="td-list" id="tdList"></div>
      <a class="td-all" href="deals.html" data-i18n="home.seeall">See all deals ›</a>
    </aside>
  </div>

  <section class="block">
    <div class="block-head"><h2 data-i18n="home.topsel">Our top selection</h2></div>
    <div class="scroll-x" id="topSelection">__SK__</div>
  </section>

  <section class="block">
    <div class="block-head"><h2 data-i18n="home.best">Our best sellers</h2><a href="deals.html" data-i18n="home.seeall2">See all</a></div>
    <div class="scroll-x" id="bestSellers">__SK__</div>
  </section>

  <section class="block">
    <div class="block-head"><h2 data-i18n="home.shopcat">Shop by category</h2></div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2 data-i18n="home.finds">Today's best finds</h2><span class="tag" data-i18n="home.sponsored">Sponsored</span></div>
    <div class="scroll-x" id="finds">__SK__</div>
  </section>

  <section class="features">
    <div class="feature"><span class="fi" id="f1"></span>The DIY, home &amp; garden specialist</div>
    <div class="feature"><span class="fi" id="f2"></span>Reliable delivery</div>
    <div class="feature"><span class="fi" id="f3"></span>Flexible payment options</div>
    <div class="feature"><span class="fi" id="f4"></span>7M+ happy customers</div>
  </section>

  <section class="block">
    <div class="block-head"><h2 data-i18n="home.brands">Our biggest brands</h2></div>
    <div class="scroll-x brand-row" id="brands"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="data/catalog.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/home.js"></script>
<script>
  document.querySelectorAll(".scroll-x").forEach(function(el){ if(el.innerHTML==="__SK__") el.innerHTML=RENDER.skeletons(4); });
  UI.mount({active:"home"}).then(HOME.init);
  RENDER.wireAdd(document);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
