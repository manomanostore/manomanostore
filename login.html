<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — ManoMano</title>
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/logo-64.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo-192.png">
<link rel="stylesheet" href="css/styles.css?v=20261128r">
</head>
<body>
<div id="site-header"></div>

<main class="auth-wrap">
  <div class="card-pane">
    <h1 id="authTitle">Seller sign in</h1>
    <p class="sub">Sign in to your shop account with the email and password you registered with.</p>

    <div id="msg"></div>

    <form id="authForm">
      <div class="field">
        <label for="identifier">Email or mobile number</label>
        <input id="identifier" type="text" autocomplete="username" placeholder="you@example.com or mobile" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
      </div>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Sign in</button>
    </form>

    <p class="center" style="margin-top:16px;color:var(--muted);font-size:13px">
      Don't have a shop yet? <a class="link" href="sell.html">Register your shop</a>
    </p>
    <p class="center" style="margin-top:10px;font-size:12px;color:var(--muted)">
      🔒 Your password is hashed on this device before it is ever sent or stored.
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js?v=20261128j"></script>
<script src="js/visit.js?v=20261127zt"></script>
<script src="data/catalog.js"></script>
<script src="js/data.js?v=20261127zb"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js?v=20261128v"></script>
<script src="js/render.js"></script>
<script src="js/login.js?v=20261127zi"></script>
<script>
  UI.mount({active:"account"}).then(SELLERLOGIN.init);
</script>
</body>
</html>
