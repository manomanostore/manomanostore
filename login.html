<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — ToolNest</title>
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="auth-wrap">
  <div class="card-pane">
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub">Access your personal account — log in with email or mobile.</p>

    <div class="seg">
      <button id="segLogin" class="on">Log in</button>
      <button id="segReg">Register</button>
    </div>

    <div id="msg"></div>

    <form id="authForm">
      <div class="field" id="nameField" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="identifier">Email or mobile number</label>
        <input id="identifier" type="text" autocomplete="username" placeholder="you@example.com or +1 555 123 4567" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" id="togglePw" aria-label="Show password">👁</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Log in</button>
    </form>

    <p class="center" style="margin-top:16px;color:var(--muted);font-size:13px">
      <span id="switchHint">New here?</span> <a class="link" id="switchLink" href="#">Create an account</a>
    </p>
    <p class="center" style="margin-top:10px;font-size:12px;color:var(--muted)">
      🔒 Your password is hashed on this device before it is ever sent or stored.
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/login.js"></script>
<script>
  UI.mount({active:"account"}).then(LOGIN.init);
</script>
</body>
</html>
