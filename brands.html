<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Brands — ManoMano</title>
<meta name="theme-color" content="#16233f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/logo-64.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> › <span>All Brands</span></div>
  <div class="block-head"><h2>All brands</h2><span class="tag" id="brandCount"></span></div>
  <div class="brand-grid" id="brandGrid"><div class="empty"><p>Loading brands…</p></div></div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="data/catalog.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script>
  UI.mount({ active: "brands" }).then(async function () {
    var grid = document.getElementById("brandGrid");
    try {
      var all = await DATA.all();
      var map = {};
      all.forEach(function (p) { if (p.brand) { (map[p.brand] = map[p.brand] || []).push(p); } });
      var brands = Object.keys(map).sort(function (a, b) { return a.localeCompare(b); });
      document.getElementById("brandCount").textContent = brands.length + (brands.length === 1 ? " brand" : " brands");
      if (!brands.length) { grid.innerHTML = '<div class="empty"><h3>No brands yet</h3><p>Brands appear here once products are added.</p></div>'; return; }
      grid.innerHTML = brands.map(function (b) {
        var n = map[b].length;
        return '<a class="brand-card" href="category.html?q=' + encodeURIComponent(b) + '">' +
          '<span class="bc-logo" aria-hidden="true">' + UI.esc(b.charAt(0).toUpperCase()) + '</span>' +
          '<span class="bc-name">' + UI.esc(b) + '</span>' +
          '<span class="bc-count">' + n + ' product' + (n === 1 ? "" : "s") + '</span></a>';
      }).join("");
    } catch (e) {
      grid.innerHTML = '<div class="empty"><h3>Couldn\'t load brands</h3><p>Please try again.</p></div>';
    }
  });
</script>
</body>
</html>
